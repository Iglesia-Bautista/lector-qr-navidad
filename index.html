
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de acceso - Navidad 2026</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #243447;
    }
    .contenedor {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }
    h1 { font-size: 23px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 7px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #24476b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #reader { width: 100%; margin-top: 20px; }
    #resultado {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .correcto { background: #e0f2e5; color: #175b2b; }
    .error { background: #fbe4e4; color: #922; }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Control de acceso</h1>
    <p>Comida de Navidad 2026</p>

    <label for="tablet">Identificador de la tablet</label>
    <input id="tablet" value="Tablet 1">

    <button id="botonIniciar" onclick="iniciarCamara()">
      ACTIVAR CÁMARA
    </button>

    <div id="reader"></div>
    <div id="resultado"></div>

    <button id="botonSiguiente" onclick="iniciarCamara()" style="display:none">
      ESCANEAR SIGUIENTE ENTRADA
    </button>
  </div>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/a/macros/iblacy.org/s/AKfycbxmp4kJKjg5YPOgXuyh2zA8axREG-_OZnt0O_ChOpc3vTPhwgPfXwAiSSSxOKYqYgb_/exec";

    let escaner = null;
    let escaneando = false;
    let consultaEnCurso = false;
    let temporizadorConsulta = null;
    let scriptConsulta = null;

    function iniciarCamara() {
      const boton = document.getElementById("botonIniciar");
      boton.disabled = true;
      boton.textContent = "ACTIVANDO CÁMARA...";

      document.getElementById("resultado").style.display = "none";
      document.getElementById("botonSiguiente").style.display = "none";

      if (!escaner) {
        escaner = new Html5Qrcode("reader");
      }

      Html5Qrcode.getCameras().then(function(camaras) {
        if (!camaras.length) {
          throw new Error("No se ha encontrado ninguna cámara.");
        }

        const trasera = camaras.find(function(c) {
          return /back|rear|environment|trasera|posterior/i.test(c.label);
        });

        const elegida = trasera || camaras[camaras.length - 1];

        return escaner.start(
          elegida.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          function(codigo) {
            procesarCodigo(codigo);
          }
        );
      }).then(function() {
        escaneando = true;
        boton.style.display = "none";
        boton.disabled = false;
      }).catch(function(error) {
        boton.disabled = false;
        boton.textContent = "ACTIVAR CÁMARA";
        mostrarResultado(
          "No se pudo abrir la cámara",
          error.message || error,
          "error"
        );
      });
    }

    function procesarCodigo(codigo) {
      if (!escaneando || consultaEnCurso) return;

      escaneando = false;
      consultaEnCurso = true;

      escaner.stop().then(function() {
        mostrarResultado(
          "COMPROBANDO ENTRADA...",
          "Estamos verificando el código QR. Espera un momento.",
          "correcto"
        );

        registrarEntrada(codigo);
      }).catch(function(error) {
        consultaEnCurso = false;
        mostrarResultado(
          "Error al detener la cámara",
          error.message || error,
          "error"
        );
        mostrarBotonSiguiente();
      });
    }

    function registrarEntrada(codigo) {
      const tablet = document.getElementById("tablet").value.trim() || "Tablet 1";

      window.respuestaAcceso = function(respuesta) {
        clearTimeout(temporizadorConsulta);

        if (scriptConsulta) {
          scriptConsulta.remove();
          scriptConsulta = null;
        }

        consultaEnCurso = false;

        if (respuesta && respuesta.ok) {
          const detalle = respuesta.mensaje ||
            "Entrada registrada correctamente.";

          mostrarResultado(
  "ENTRADA REGISTRADA",
  "Acceso autorizado correctamente.",
  "correcto",
  respuesta
);
        } else {
  const duplicada = respuesta && respuesta.duplicada;

  const detalle = respuesta && respuesta.mensaje
    ? respuesta.mensaje
    : "No se ha podido validar esta entrada.";

  mostrarResultado(
    duplicada ? "ENTRADA YA UTILIZADA" : "ENTRADA NO AUTORIZADA",
    detalle,
    "error",
    duplicada ? respuesta : null
  );
}

        mostrarBotonSiguiente();
      };

      const parametros = new URLSearchParams({
        pagina: "apiAcceso",
        identificador: codigo,
        tablet: tablet,
        callback: "respuestaAcceso"
      });

      scriptConsulta = document.createElement("script");
      scriptConsulta.src = URL_APPS_SCRIPT + "?" + parametros.toString();

      scriptConsulta.onerror = function() {
        clearTimeout(temporizadorConsulta);
        consultaEnCurso = false;

        if (scriptConsulta) {
          scriptConsulta.remove();
          scriptConsulta = null;
        }

        mostrarResultado(
          "ERROR DE CONEXIÓN",
          "No se ha podido contactar con el sistema. Comprueba la conexión y vuelve a intentarlo.",
          "error"
        );

        mostrarBotonSiguiente();
      };

      temporizadorConsulta = setTimeout(function() {
        consultaEnCurso = false;

        if (scriptConsulta) {
          scriptConsulta.remove();
          scriptConsulta = null;
        }

        mostrarResultado(
          "TIEMPO DE ESPERA AGOTADO",
          "No hemos recibido respuesta del sistema. Comprueba la conexión antes de volver a escanear.",
          "error"
        );

        mostrarBotonSiguiente();
      }, 20000);

      document.body.appendChild(scriptConsulta);
    }

    function mostrarBotonSiguiente() {
      document.getElementById("botonSiguiente").style.display = "block";
    }

   
function mostrarResultado(titulo, detalle, clase, datos) {
  const resultado = document.getElementById("resultado");
  resultado.className = clase;
  resultado.replaceChildren();

  const encabezado = document.createElement("strong");
  encabezado.textContent = titulo;
  resultado.appendChild(encabezado);

  const parrafo = document.createElement("p");
  parrafo.textContent = detalle;
  resultado.appendChild(parrafo);

  if (datos) {
    const ficha = document.createElement("div");
    ficha.style.marginTop = "15px";
    ficha.style.padding = "15px";
    ficha.style.background = "#ffffff";
    ficha.style.color = "#222222";
    ficha.style.borderRadius = "10px";
    ficha.style.textAlign = "left";

    const nombre = document.createElement("p");
    nombre.innerHTML = "<strong>Nombre:</strong> ";
    nombre.appendChild(document.createTextNode(datos.nombre || ""));
    
    const numero = document.createElement("p");
    numero.innerHTML = "<strong>Número de entrada:</strong> ";
    numero.appendChild(document.createTextNode(datos.numeroEntrada || ""));

    const menu = document.createElement("p");
    menu.innerHTML = "<strong>Menú:</strong> ";
    menu.appendChild(document.createTextNode(datos.menu || ""));

    ficha.appendChild(nombre);
    ficha.appendChild(numero);
    ficha.appendChild(menu);
    resultado.appendChild(ficha);
  }

  resultado.style.display = "block";
}

</script>
</body>
</html>
